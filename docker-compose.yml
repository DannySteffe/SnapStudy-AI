version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: snapai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: snapai
      MONGO_INITDB_ROOT_PASSWORD: snapai_password_change_in_production
      MONGO_INITDB_DATABASE: snapai
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - snapai-network

  # Backend API
  api:
    build: .
    container_name: snapai-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://snapai:snapai_password_change_in_production@mongodb:27017/snapai?authSource=admin
      - JWT_SECRET=your-super-secure-jwt-secret-change-in-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLIENT_URL=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - snapai-network
    volumes:
      - ./uploads:/app/uploads

  # Frontend (if serving with nginx)
  frontend:
    image: nginx:alpine
    container_name: snapai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - snapai-network

networks:
  snapai-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
